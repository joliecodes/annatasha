{% assign m = site.data.moods.moods | where: "slug", include.slug | first %}{% if m %}<a class="chip" href="/blog/#{{ m.slug }}" style="--c:{{ m.color }}" data-caption="{{ m.caption }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ m.icon }}</svg>{{ m.name }}</a>{% endif %}
