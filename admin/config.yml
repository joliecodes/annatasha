backend:
  name: github
  repo: joliecodes/annatasha
  branch: main
  base_url: https://api.netlify.com
  site_domain: annatasha.netlify.app

site_url: https://blog.annatasha.com
display_url: https://blog.annatasha.com
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

editor:
  preview: false

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    editor: { preview: false }
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMM YYYY", time_format: false }
      - label: Moods
        name: moods
        widget: relation
        collection: site
        file: moods
        search_fields: ["moods.*.name"]
        display_fields: ["moods.*.name"]
        value_field: "moods.*.slug"
        multiple: true
        required: false
      - { label: Words, name: body, widget: markdown, hint: "Photo captions: add a line of *italics* right under a photo." }

  - name: site
    label: Site text
    editor: { preview: false }
    files:
      - label: About the writer
        name: bio
        file: _data/bio.yml
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Bio, name: text, widget: markdown, buttons: [italic, bold, link] }
      - label: Landing page note
        name: landing
        file: _data/landing.yml
        fields:
          - { label: Small line above the note, name: kicker, widget: string }
          - { label: Note, name: note, widget: text }
          - { label: Link text, name: link_text, widget: string }
      - label: Blog page text
        name: blog
        file: _data/blog.yml
        fields:
          - { label: Page heading, name: heading, widget: string }
          - { label: Small line above your name, name: bio_kicker, widget: string }
          - { label: Small line above the moods, name: moods_kicker, widget: string }
          - { label: Message when a mood has no posts, name: empty_text, widget: string }
          - { label: Small line above the older posts list, name: earlier_kicker, widget: string }
          - { label: Calendar page heading, name: timeline_heading, widget: string }
          - { label: Calendar page subtitle, name: timeline_sub, widget: string }
      - label: Moods
        name: moods
        file: _data/moods.yml
        fields:
          - label: Moods
            name: moods
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: true
            summary: "{{fields.name}} ({{fields.caption}})"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Hover caption, name: caption, widget: string }
              - { label: Slug, name: slug, widget: hidden }
              - { label: Colour, name: color, widget: hidden }
              - { label: Icon, name: icon, widget: hidden }
