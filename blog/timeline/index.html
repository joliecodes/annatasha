---
timeline_page: true
---
<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
<img class="deco-constellation" src="/assets/deco/space.webp" alt="" aria-hidden="true">
<div class="blog">
  <aside class="side">
    {% include bio-card.html %}
  </aside>

  <main class="cal-page">
    <nav class="topbar">
      <a href="/blog/" class="back">
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 6H2M7 1.5 2 6l5 4.5"/></svg>
        {{ site.data.blog.heading }}</a>
    </nav>
    <header class="feed-head">
      <h1>{{ site.data.blog.timeline_heading }}</h1>
      <p class="cal-sub">{{ site.data.blog.timeline_sub }}</p>
    </header>

    <div class="view-switch" role="tablist" aria-label="How to browse">
      <button type="button" role="tab" data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Calendar</button>
      <button type="button" role="tab" data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>List</button>
    </div>

    <section class="view-calendar">
    <div class="cal-nav">
      <button type="button" class="cal-btn" data-step="-1" aria-label="Previous month"><svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6H2M7 1.5 2 6l5 4.5"/></svg></button>
      <h2 class="cal-month" aria-live="polite"></h2>
      <button type="button" class="cal-btn" data-step="1" aria-label="Next month"><svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h21M17 1.5 22 6l-5 4.5"/></svg></button>
    </div>
    <div class="cal-grid" role="grid"></div>

    <div class="cal-months">
      <p class="kicker">months with stories</p>
      <div class="cal-month-list"></div>
    </div>

    </section>

    <section class="view-list" hidden>
      <ol class="posts">
      {% for post in site.posts %}
      {% include post-preview.html post=post %}
      {% endfor %}
      </ol>
    </section>

    <noscript>
      <ol class="cal-fallback">{% for post in site.posts %}<li><a href="{{ post.url }}">{{ post.title }}</a> · {{ post.date | date: "%-d %B %Y" }}</li>{% endfor %}</ol>
    </noscript>
  </main>
</div>
<script>
  window.STORIES = [{% for post in site.posts %}{% assign thumb = nil %}{% assign img_parts = post.content | split: '<img' %}{% if img_parts.size > 1 %}{% assign src_parts = img_parts[1] | split: 'src="' %}{% if src_parts.size > 1 %}{% assign thumb = src_parts[1] | split: '"' | first %}{% endif %}{% endif %}{"t":{{ post.title | jsonify }},"u":{{ post.url | jsonify }},"d":"{{ post.date | date: '%Y-%m-%d' }}","nice":"{{ post.date | date: '%-d %B %Y' }}","m":{{ post.moods | jsonify }},"x":{{ post.excerpt | strip_html | strip_newlines | truncatewords: 26 | jsonify }},"i":{{ thumb | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}];
  window.MOODS = { {% for m in site.data.moods.moods %}{{ m.slug | jsonify }}:{"c":{{ m.color | jsonify }},"n":{{ m.name | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %} };
</script>
<script src="/assets/calendar.js"></script>
<script src="/assets/side.js"></script>
</body>
</html>
