---
timeline_page: true
---
<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
<img class="deco-constellation" src="/assets/deco/space.webp" alt="" aria-hidden="true">
<div class="blog">
  <aside class="side">
    {% include bio-card.html %}
  </aside>

  <main class="cal-page">
    <nav class="topbar">
      <a href="/blog/" class="back">
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 6H2M7 1.5 2 6l5 4.5"/></svg>
        {{ site.data.blog.heading }}</a>
    </nav>
    <header class="feed-head">
      <h1>{{ site.data.blog.timeline_heading }}</h1>
      <p class="cal-sub">{{ site.data.blog.timeline_sub }}</p>
    </header>

    <div class="cal-nav">
      <button type="button" class="cal-btn" data-step="-1" aria-label="Previous month"><svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6H2M7 1.5 2 6l5 4.5"/></svg></button>
      <h2 class="cal-month" aria-live="polite"></h2>
      <button type="button" class="cal-btn" data-step="1" aria-label="Next month"><svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h21M17 1.5 22 6l-5 4.5"/></svg></button>
    </div>
    <div class="cal-grid" role="grid"></div>

    <div class="cal-months">
      <p class="kicker">months with stories</p>
      <div class="cal-month-list"></div>
    </div>

    <noscript>
      <ol class="cal-fallback">{% for post in site.posts %}<li><a href="{{ post.url }}">{{ post.title }}</a> · {{ post.date | date: "%-d %B %Y" }}</li>{% endfor %}</ol>
    </noscript>
  </main>
</div>
<script>
  window.STORIES = [{% for post in site.posts %}{"t":{{ post.title | jsonify }},"u":{{ post.url | jsonify }},"d":"{{ post.date | date: '%Y-%m-%d' }}","m":{{ post.moods | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}];
  window.MOOD_COLOURS = { {% for m in site.data.moods.moods %}{{ m.slug | jsonify }}:{{ m.color | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %} };
</script>
<script src="/assets/calendar.js"></script>
<script src="/assets/side.js"></script>
</body>
</html>
