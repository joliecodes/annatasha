<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
<img class="deco-constellation" src="/assets/deco/space.webp" alt="" aria-hidden="true">
<div class="reading">
  <nav class="topbar">
    <a href="/blog/" class="mini-logo" aria-label="All stories">{% include logo.svg %}</a>
    <a href="/blog/" class="back">all stories</a>
    <div class="sizer" role="group" aria-label="Text size">
      <button type="button" data-step="-1" aria-label="Smaller text"><span class="a-sm">A</span></button>
      <button type="button" data-step="1" aria-label="Bigger text"><span class="a-lg">A</span></button>
    </div>
  </nav>
  <header class="post-head">
    <p class="date">{{ page.date | date: "%-d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.moods %}<div class="chips">{% for s in page.moods %}{% include mood-chip.html slug=s %}{% endfor %}</div>{% endif %}
  </header>
  <article class="prose">{{ content }}</article>
  <footer class="post-foot">
    <span class="sign">— Annatasha</span>
    <a href="/blog/" class="back">back to all stories</a>
  </footer>
</div>
<script>
(function () {
  var sizes = [0.8, 0.88, 1, 1.12, 1.26], key = 'reader-size-v2', i = 1;
  try { var saved = parseInt(localStorage.getItem(key), 10); if (saved >= 0 && saved < sizes.length) i = saved; } catch (e) {}
  var root = document.documentElement, btns = document.querySelectorAll('.sizer button');
  function set() {
    root.style.setProperty('--reader', sizes[i]);
    btns[0].disabled = i === 0; btns[1].disabled = i === sizes.length - 1;
    try { localStorage.setItem(key, i); } catch (e) {}
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { i = Math.min(sizes.length - 1, Math.max(0, i + +b.dataset.step)); set(); }); });
  set();
})();
</script>
</body>
</html>
