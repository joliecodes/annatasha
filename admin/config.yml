backend:
  name: github
  repo: joliecodes/annatasha
  branch: main

site_url: https://annatasha.com
display_url: https://annatasha.com
media_folder: "assets/uploads"
public_folder: "/assets/uploads"


collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm", date_format: "D MMM YYYY", time_format: "h:mm A", hint: "Pick a future date and time to schedule it. It goes live within an hour of that time." }
      - label: Moods
        name: moods
        widget: relation
        collection: site
        file: moods
        search_fields: ["moods.*.name"]
        display_fields: ["moods.*.name"]
        value_field: "moods.*.slug"
        multiple: true
        required: false
      - { label: "Potty Mouth", name: potty_mouth, widget: boolean, default: false, required: false, hint: "Switch on if this one has strong language. A little label shows under the title." }
      - { label: "Live on the site", name: published, widget: boolean, default: true, required: false, hint: "Switch off to keep this as a draft. It saves, but stays hidden until you switch it back on and Save." }
      - { label: Words, name: body, widget: markdown, hint: "Photo captions: add a line of *italics* right under a photo." }

  - name: site
    label: Site text
    editor: { preview: false }
    files:
      - label: About the writer
        name: bio
        file: _data/bio.yml
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Bio, name: text, widget: markdown, buttons: [italic, bold, link] }
      - label: Landing page note
        name: landing
        file: _data/landing.yml
        fields:
          - { label: Small line above the note, name: kicker, widget: string }
          - { label: Note, name: note, widget: text }
          - { label: Link text, name: link_text, widget: string }
      - label: Blog page text
        name: blog
        file: _data/blog.yml
        fields:
          - { label: Page heading, name: heading, widget: string }
          - { label: Small line above your name, name: bio_kicker, widget: string }
          - { label: Small line above the moods, name: moods_kicker, widget: string }
          - { label: Message when a mood has no posts, name: empty_text, widget: string }
          - { label: Small line above the older posts list, name: earlier_kicker, widget: string }
          - { label: Label above older entries on the blog page, name: older_kicker, widget: string }
          - { label: Potty Mouth label under post titles, name: potty_label, widget: string }
          - { label: Calendar page heading, name: timeline_heading, widget: string }
          - { label: Calendar page subtitle, name: timeline_sub, widget: string }
      - label: Moods
        name: moods
        file: _data/moods.yml
        fields:
          - label: Moods
            name: moods
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: true
            summary: "{{fields.name}} ({{fields.caption}})"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Hover caption, name: caption, widget: string }
              - { label: Slug, name: slug, widget: hidden }
              - { label: Colour, name: color, widget: hidden }
              - { label: Icon, name: icon, widget: hidden }
      - label: Thoughts box (comments)
        name: comments
        file: _data/comments.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Link that opens the form, name: share_label, widget: string }
          - { label: Button text, name: button, widget: string }
          - { label: Name box hint, name: name_placeholder, widget: string }
          - { label: Message box hint, name: message_placeholder, widget: string }
          - { label: Message after sending, name: thanks, widget: string }
          - { label: Message when there are no thoughts yet, name: empty, widget: string }
          - { label: API, name: api, widget: hidden }
          - { label: Turnstile site key, name: turnstile_sitekey, widget: hidden }
